; AirAlert-ESP8266 — див. docs/SPEC.md §107, §132
[platformio]
default_envs = nodemcuv2_dev

[env]
lib_deps =
    bblanchon/ArduinoJson@7.4.3

[base_esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -Wall
    -D BEARSSL_SSL_BASIC
    ; AIRALERT_VERSION + AIRALERT_BUILD are injected from the VERSION file by
    ; tools/build_stamp.py (extra_scripts below) — bump the version there.
build_unflags = -std=gnu++11
extra_scripts = pre:tools/build_stamp.py, pre:tools/pio_build_web.py

[env:nodemcuv2_dev]
extends = base_esp8266
build_flags =
    ${base_esp8266.build_flags}
    -D AIRALERT_DEV=1
    -D DEBUG_ESP_PORT=Serial

[env:nodemcuv2_prod]
extends = base_esp8266
build_flags =
    ${base_esp8266.build_flags}
    -D AIRALERT_PROD=1
    -D NDEBUG

; Host-side unit tests: pure business logic only (SPEC §109, §132)
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D AIRALERT_NATIVE=1
lib_compat_mode = off

; Dev build wired to the local alerts emulator (SPEC 133/143).
; Edit the host IP to wherever tools/alerts_emulator.py runs.
[env:nodemcuv2_mock]
extends = env:nodemcuv2_dev
build_flags =
    ${env:nodemcuv2_dev.build_flags}
    -D AIRALERT_MOCK_URL='"http://192.168.1.210:8787/api/v3/alerts"'
