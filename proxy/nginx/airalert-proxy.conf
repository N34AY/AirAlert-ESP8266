# AirAlert caching proxy for ukrainealarm.com API v3 (http{} context:
# drop into /etc/nginx/conf.d/ or include it from http{}). See proxy/README.md.

lua_package_path "/opt/airalert-proxy/lua/?.lua;;";
lua_shared_dict airalert 4m;

# upstream TLS (lua-resty-http does not use the proxy_ssl_* settings)
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
lua_ssl_verify_depth 3;
# ponytail: public DNS for the cosocket; swap for the LAN resolver if outbound DNS is filtered
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

# per-device safety net: firmware polls every 20 s by default
limit_req_zone $binary_remote_addr zone=airalert_dev:1m rate=12r/m;

init_by_lua_block {
    require("airalert.proxy").configure({
        key_file = "/etc/airalert/ukrainealarm.key",   -- one line, the raw key
        tokens_file = "/etc/airalert/devices.txt",     -- "token  # device" per line
        regions_file = "/etc/airalert/regions.json",  -- proxy/nginx/regions.json (tools/update_locations.py)
        webhook_pem_file = "/etc/airalert/webhook-public.pem", -- api.ukrainealarm.com/webhook-public.pem
    })
}
init_worker_by_lua_block { require("airalert.proxy").start() }

server {
    listen 8080;
    access_log /var/log/nginx/airalert-proxy.log;

    # official path, so firmware only changes the base URL
    location = /api/v3/alerts {
        limit_req zone=airalert_dev burst=5 nodelay;
        limit_req_status 429; # 503 is reserved for "stale data"
        content_by_lua_block { require("airalert.proxy").serve_alerts() }
    }
    location = /health {
        content_by_lua_block { require("airalert.proxy").serve_health() }
    }
    location / { return 404; }
}

# Webhook receiver: the ONLY thing exposed to the internet (router port-forward),
# so devices' API and /health stay LAN-only.
server {
    listen 8081;
    access_log /var/log/nginx/airalert-webhook.log;

    location = /webhook/ukrainealarm {
        client_max_body_size 64k;
        client_body_buffer_size 64k; # body must stay in memory for the signature
        content_by_lua_block { require("airalert.proxy").serve_webhook() }
    }
    location / { return 404; }
}
